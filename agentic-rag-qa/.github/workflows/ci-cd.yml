name: CI/CD

on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    env:
      STORE_BACKEND: memory
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
      - run: pip install -r requirements-dev.txt
      - name: Lint
        run: ruff check .
      - name: Unit and API tests
        run: pytest -q
      - name: Retrieval evaluation
        run: python -m eval.run_eval

  build:
    needs: test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Build Docker image
        run: docker build -t agentic-rag-qa .

  deploy:
    # Enable by setting repository variable DEPLOY_ENABLED=true and adding the
    # EC2_HOST, EC2_USER and EC2_SSH_KEY secrets (see README).
    needs: build
    if: github.ref == 'refs/heads/main' && github.event_name == 'push' && vars.DEPLOY_ENABLED == 'true'
    runs-on: ubuntu-latest
    steps:
      - name: Deploy to EC2 over SSH
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: ${{ secrets.EC2_HOST }}
          username: ${{ secrets.EC2_USER }}
          key: ${{ secrets.EC2_SSH_KEY }}
          script: |
            set -e
            cd ~/agentic-rag-qa
            git pull --ff-only origin main
            docker compose up -d --build
            docker image prune -f
            sleep 20
            curl --fail --retry 5 --retry-delay 10 http://localhost:8000/health
